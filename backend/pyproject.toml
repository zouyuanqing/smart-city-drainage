[build-system]
requires = ["setuptools==69.5.1", "wheel==0.43.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-city-drainage-backend"
version = "1.0.0"
description = "Smart-city drainage backend with optional EPA SWMM integration"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.109.2",
  "uvicorn[standard]==0.27.1",
  "python-multipart==0.0.7",
  "sse-starlette==1.8.2",
  "sqlalchemy[asyncio]==2.0.27",
  "asyncpg==0.29.0",
  "alembic==1.13.1",
  "psycopg2-binary==2.9.9",
  "influxdb-client==1.41.0",
  "redis==5.0.1",
  "numpy==1.26.4",
  "Pillow==10.2.0",
  "python-jose[cryptography]==3.3.0",
  "passlib[bcrypt]==1.7.4",
  "bcrypt==4.1.2",
  "pydantic==2.6.1",
  "pydantic-settings==2.1.0",
  "httpx==0.27.0",
  "python-json-logger==2.0.7",
  "prometheus-fastapi-instrumentator==6.1.0",
]

[project.optional-dependencies]
# Interpreter matrix mirrors requirements*.txt: 3.11 is the contract
# interpreter. The fallback extra contains only wheel-backed numerical support;
# it never installs EPA SWMM, CUDA, Torch, OpenCV, or ONNX Runtime.
hydraulic = [
  "numpy==1.26.4 ; python_version < '3.13'",
  "numpy==2.3.4 ; python_version >= '3.13'",
  "Pillow==10.2.0 ; python_version < '3.13'",
  "Pillow==12.1.0 ; python_version >= '3.13'",
]
ai-cpu = [
  "numpy==1.26.4 ; python_version < '3.13'",
  "numpy==2.3.4 ; python_version >= '3.13'",
  "ultralytics==8.1.0 ; python_version < '3.13'",
  "torch==2.2.1 ; python_version < '3.13'",
  "torchvision==0.17.1 ; python_version < '3.13'",
  "opencv-python-headless==4.9.0.80 ; python_version < '3.13'",
  "opencv-python-headless==4.11.0.86 ; python_version >= '3.13'",
  "onnxruntime==1.17.1 ; python_version < '3.13'",
]
ai-gpu = [
  "numpy==1.26.4 ; python_version < '3.13'",
  "numpy==2.3.4 ; python_version >= '3.13'",
  "ultralytics==8.1.0 ; python_version < '3.13'",
  "torch==2.2.1 ; python_version < '3.13'",
  "torchvision==0.17.1 ; python_version < '3.13'",
  "opencv-python-headless==4.9.0.80 ; python_version < '3.13'",
  "opencv-python-headless==4.11.0.86 ; python_version >= '3.13'",
  "onnxruntime-gpu==1.17.1 ; python_version < '3.13'",
]
# Optional EPA SWMM adapter. The engine is an external, version/hash-pinned
# executable; this extra intentionally has no PyPI/native package dependency.
# Configure it with EPA_SWMM_EXECUTABLE, EPA_SWMM_VERSION and EPA_SWMM_SHA256.
swmm = []
test = [
  "pytest==8.0.1",
  "pytest-asyncio==0.23.6",
  "pytest-cov==4.1.0",
  "aiosqlite==0.20.0",
  "black==24.1.0",
  "isort==5.13.0",
  "flake8==7.0.0",
  "mypy==1.8.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.black]
line-length = 88
target-version = ["py311"]
# Alembic revisions are hash-approved artifacts; migration-gate validates
# their exact bytes independently of source formatting.
extend-exclude = "alembic/versions"

[tool.isort]
profile = "black"
known_first_party = ["app"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
