name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
  EVIDENCE_ROOT: artifacts/hydraulic/${{ env.RUN_ID }}

jobs:
  dependency-lock:
    name: Dependency Lock Install
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-py311.lock
      - name: Install CPU profile from the hash lock
        run: |
          cd backend
          python -m venv .venv-lock-cpu
          .venv-lock-cpu/bin/python -m pip install --require-hashes -r requirements-py311.lock
          .venv-lock-cpu/bin/python -m pip check
      - name: Import application from the CPU lock
        run: |
          cd backend
          PYTHONPATH=. .venv-lock-cpu/bin/python -c "from app.main import app; print(app.title)"
      - name: Install minimal fallback from the hash lock
        run: |
          cd backend
          python -m venv .venv-lock-fallback
          .venv-lock-fallback/bin/python -m pip install --require-hashes -r requirements-hydraulic-py311.lock
          .venv-lock-fallback/bin/python -m pip check
      - name: Import application from the fallback lock
        run: |
          cd backend
          PYTHONPATH=. .venv-lock-fallback/bin/python -c "from app.main import app; from app.core.config import Settings; print(app.title, Settings(_env_file=None).resolve_auto_solver())"

  host-interpreter:
    name: Host Interpreter (3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install CPU requirements on a newer interpreter
        run: |
          cd backend
          pip install --no-cache-dir -r requirements-cpu.txt
          python -m pip check
      - name: Import application
        run: cd backend && python -c "from app.main import app; print(app.title)"
      - name: Run settings, matrix and auth tests
        run: |
          cd backend
          python -m pytest tests/test_requirements_matrix.py tests/test_simulation_settings.py tests/test_security_tokens.py tests/test_api/test_auth.py -q

  g0-quality:
    name: G0 Real Quality Commands
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-py311.lock
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked Python dependencies
        run: pip install --require-hashes -r backend/requirements-py311.lock
      - name: Record target runtime versions
        run: |
          python --version
          node --version
          npm --version
          test "$(node --version)" = "v18.20.8"
          test "$(npm --version)" = "10.8.2"
      - name: Run G0 verifier (pytest, Vitest, build, lint, mypy, lifespan)
        run: >-
          python scripts/verify_hydraulic_stack.py
          --gate g0
          --run-id "$RUN_ID"
          --evidence-dir "$EVIDENCE_ROOT/g0"
      - name: Upload G0 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hydraulic-g0-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_ROOT }}/g0
          if-no-files-found: warn
          retention-days: 14

  frontend-quality:
    name: Frontend Vitest Lint Format Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact frontend dependencies
        run: npm --prefix frontend ci
      - name: Run Vitest
        run: npm --prefix frontend test
      - name: Run ESLint
        run: npm --prefix frontend run lint
      - name: Check formatting
        run: npm --prefix frontend run format:check
      - name: Build production frontend
        run: npm --prefix frontend run build
      - name: Check owned Node harnesses
        run: |
          node --check frontend/performance/run-twin-map.mjs
          node --check frontend/e2e/run-ac-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend/dist
          if-no-files-found: error
          retention-days: 1

  compose-config:
    name: Compose Config (Both Profiles)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HYDRAULIC_SPATIAL_BACKEND: portable
      POSTGRES_PASSWORD: ci-postgres-secret
      REDIS_PASSWORD: ci-redis-secret
      INFLUXDB_PASSWORD: ci-influx-secret
      INFLUXDB_TOKEN: ci-influx-token-secret
      DOCKER_INFLUXDB_ADMIN_TOKEN: ci-influx-token-secret
      DATABASE_URL: postgresql+asyncpg://drainage_admin:ci-postgres-secret@postgres:5432/smart_drainage
      DATABASE_URL_SYNC: postgresql://drainage_admin:ci-postgres-secret@postgres:5432/smart_drainage
      INFLUXDB_ORG: smart-city
      INFLUXDB_BUCKET: sensor_data
      REDIS_URL: redis://:ci-redis-secret@redis:6379/0
      JWT_SECRET_KEY: ci-jwt-secret-at-least-32-characters
      JWT_PRIVATE_KEY: ci-placeholder-private-key
      JWT_PUBLIC_KEY: ci-placeholder-public-key
      JWT_ISSUER: smart-city-drainage
      JWT_AUDIENCE: smart-city-api
      GRAFANA_ADMIN_PASSWORD: ci-grafana-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Render portable Compose config
        env:
          HYDRAULIC_SPATIAL_BACKEND: portable
        run: docker compose --profile production --profile monitoring -f docker-compose.yml config --quiet
      - name: Verify portable Compose contract (config scope only)
        id: portable
        run: >-
          python scripts/verify_hydraulic_stack.py
          --gate g6
          --profile portable
          --mode config
          --run-id "$RUN_ID"
          --evidence-dir "$EVIDENCE_ROOT/g6/portable"
      - name: Render postgis Compose config
        if: always()
        env:
          HYDRAULIC_SPATIAL_BACKEND: postgis
        run: docker compose --profile production --profile monitoring -f docker-compose.yml config --quiet
      - name: Verify postgis Compose contract (config scope only)
        if: always()
        run: >-
          python scripts/verify_hydraulic_stack.py
          --gate g6
          --profile postgis
          --mode config
          --run-id "$RUN_ID"
          --evidence-dir "$EVIDENCE_ROOT/g6/postgis"
      - name: Upload Compose config evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hydraulic-compose-config-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_ROOT }}/g6
          if-no-files-found: warn
          retention-days: 14

  frontend-e2e:
    name: Hydraulic AC Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact frontend dependencies
        run: npm --prefix frontend ci
      - name: Download production build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend/dist
      - name: Record browser
        run: |
          test -n "${CHROME_PATH:-/usr/bin/google-chrome}"
          "${CHROME_PATH:-/usr/bin/google-chrome}" --version
      - name: Run fixture-backed AC browser E2E
        run: >-
          node frontend/e2e/run-ac-smoke.mjs
          --fixture frontend/e2e/fixtures/ac-smoke-v1.json
          --output "$EVIDENCE_ROOT/e2e/ac-smoke.json"
          --timeout-seconds 120
          --scenario-timeout-seconds 20
          --run-id "$RUN_ID"
      - name: Upload AC E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hydraulic-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_ROOT }}/e2e
          if-no-files-found: warn
          retention-days: 14

  g5-performance:
    name: G5 5k-10k Performance
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-py311.lock
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked Python dependencies
        run: pip install --require-hashes -r backend/requirements-py311.lock
      - name: Install exact frontend dependencies
        run: npm --prefix frontend ci
      - name: Self-test backend benchmark accounting
        run: python scripts/benchmark_hydraulic.py --fixture unused --output unused --self-test
      - name: Run G5 verifier (all four frozen harnesses required)
        run: >-
          python scripts/verify_hydraulic_stack.py
          --gate g5
          --run-id "$RUN_ID"
          --evidence-dir "$EVIDENCE_ROOT/g5"
      - name: Upload G5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hydraulic-g5-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_ROOT }}/g5
          if-no-files-found: warn
          retention-days: 14

  acceptance-summary:
    name: Same-run Acceptance Summary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - g0-quality
      - frontend-quality
      - compose-config
      - frontend-e2e
      - g5-performance
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download same-run G0 evidence
        uses: actions/download-artifact@v4
        with:
          name: hydraulic-g0-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_ROOT }}/g0
      - name: Download same-run Compose evidence
        uses: actions/download-artifact@v4
        with:
          name: hydraulic-compose-config-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_ROOT }}/g6
      - name: Download same-run E2E evidence
        uses: actions/download-artifact@v4
        with:
          name: hydraulic-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_ROOT }}/e2e
      - name: Download same-run G5 evidence
        uses: actions/download-artifact@v4
        with:
          name: hydraulic-g5-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_ROOT }}/g5
      - name: Aggregate AC-1 through AC-8
        run: >-
          python scripts/verify_hydraulic_stack.py
          --gate acceptance
          --ac ac1,ac2,ac3,ac4,ac5,ac6,ac7,ac8
          --run-id "$RUN_ID"
          --evidence-dir "$EVIDENCE_ROOT/acceptance"
      - name: Upload acceptance summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hydraulic-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_ROOT }}/acceptance
          if-no-files-found: warn
          retention-days: 14
