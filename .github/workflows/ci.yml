name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd backend
          pip install --no-cache-dir black isort flake8 mypy
          pip install --no-cache-dir -r requirements-cpu.txt
      - name: Check formatting
        run: cd backend && black --check .
      - name: Check imports
        run: cd backend && isort --check-only .
      - name: Lint
        run: cd backend && flake8 app/
      - name: Type check
        run: cd backend && mypy app/ --ignore-missing-imports
        continue-on-error: true

  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd backend
          pip install --no-cache-dir -r requirements-cpu.txt
          pip install --no-cache-dir aiosqlite
      - name: Run tests
        run: cd backend && python -m pytest tests/ -v --tb=short
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          REDIS_URL: redis://localhost:6379/0
          INFLUXDB_URL: http://localhost:8086
          JWT_SECRET_KEY: test-secret-key

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Lint
        run: cd frontend && npm run lint
      - name: Check formatting
        run: cd frontend && npm run format:check

  frontend-test:
    name: Frontend Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Run tests
        run: cd frontend && npm test

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f docker/backend/Dockerfile.cpu -t backend-test ./backend
      - name: Build frontend image
        run: docker build -f docker/frontend/Dockerfile -t frontend-test ./frontend
