<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A855F7;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- 六边形轮廓 -->
  <polygon points="100,10 175,55 175,145 100,190 25,145 25,55"
           fill="none" stroke="url(#g1)" stroke-width="3" filter="url(#glow)"/>
  <!-- 内部电路图案 -->
  <line x1="60" y1="100" x2="140" y2="100" stroke="#00D4FF" stroke-width="1.5" opacity="0.6"/>
  <line x1="75" y1="75" x2="100" y2="100" stroke="#00D4FF" stroke-width="1" opacity="0.4"/>
  <line x1="100" y1="100" x2="125" y2="125" stroke="#00D4FF" stroke-width="1" opacity="0.4"/>
  <circle cx="100" cy="100" r="8" fill="url(#g1)" filter="url(#glow)"/>
  <circle cx="60" cy="100" r="3" fill="#00FF88" opacity="0.8"/>
  <circle cx="140" cy="100" r="3" fill="#00FF88" opacity="0.8"/>
  <!-- 文字 -->
  <text x="100" y="160" text-anchor="middle" font-family="monospace"
        font-size="14" fill="#00D4FF" filter="url(#glow)">SCN</text>
</svg>
