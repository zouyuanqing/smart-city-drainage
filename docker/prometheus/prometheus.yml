global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: smart-city-drainage

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: smart-city-backend
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - backend:8000
        labels:
          component: api

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
